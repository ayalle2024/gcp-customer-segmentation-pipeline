# Variables de entorno del Workflow orquestador-cust-segmen.
# Se cargan en la consola al crearlo (sección "Environment variables"), una
# por una: nombre = clave, valor = el de este archivo. El YAML las lee con
# sys.get_env("clave"); no hay nada hardcodeado en orquestador-cust-segmen.yaml.
# Los valores entre <> son propios del proyecto: reemplazarlos por los reales.
project_id: arl-dtpr-dev-cust-segmen
project_number: "<PROJECT_NUMBER>"
region: us-central1
transfer_location: us
cloud_run_service_name: cr-registration-ingest
transfer_config_id_enrollment: "<ID_SQ_SYNTHETIC_ENROLLMENT>"
transfer_config_id_segment: "<ID_SQ_EVALUATE_CUSTOMER_SEGMENT>"
poll_interval_seconds: "10"
cf_route_customer_decision_url: "<URL_CF_ROUTE_CUSTOMER_DECISION>"
bq_dataset: std_arl_all_randomuser
enrichment_max_attempts: "30"
